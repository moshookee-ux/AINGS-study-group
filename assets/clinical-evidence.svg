<text x="242" y="906" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start" letter-spacing="1">SYNTHESIS / 汇总</text>
<text x="242" y="939" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650" fill="#ffffff" text-anchor="start" >综合解释与需要复核的问题</text>
