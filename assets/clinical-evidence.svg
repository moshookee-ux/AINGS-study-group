<text x="455" y="722" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650" fill="#4e55ad" text-anchor="start" >归属与机制假设</text>
<text x="455" y="752" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#50667a" text-anchor="start" >与药敏表型等资料对照</text>
