<text x="57" y="722" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="650" fill="#087f78" text-anchor="start" >物种识别</text>
<text x="57" y="752" font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#50667a" text-anchor="start" >或未知类群候选</text>
