name: 分享一份资料
description: 你的笔记、教程、代码，或想推荐的论文、工具与数据集。
title: "[资料] "
body:
  - type: textarea
    id: resource
    attributes:
      label: 想分享什么
      description: 贴上资料链接或你整理的内容。分享自己的笔记、教程和代码也欢迎。
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 你觉得哪里值得看
      description: 可以聊聊它帮助你解决了什么问题，或适合哪些伙伴。
  - type: input
    id: topic
    attributes:
      label: 相关主题
      description: 可以填已有主题，也可以写一个新的方向。
