name: 补充或修正内容
description: 指出一个问题、补一个例子，或者分享更清楚的解释。
title: "[内容] "
body:
  - type: input
    id: location
    attributes:
      label: 在哪一页
      description: 贴上页面链接，或写下主题名称。
  - type: textarea
    id: idea
    attributes:
      label: 想一起看看什么
      description: 说说遇到的问题，或你想补充的内容。
    validations:
      required: true
  - type: textarea
    id: reference
    attributes:
      label: 相关资料或例子
      description: 可以附上原文、公式、代码或运行结果。
